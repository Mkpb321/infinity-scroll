<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>InfinityScroll</title>
  <style>
    :root { font-synthesis: none; color-scheme: light; }
    * { box-sizing: border-box; }
    html { background:#fff; scroll-behavior:auto; -webkit-text-size-adjust:100%; }
    body { margin:0; background:#fff; color:#151515; }
    body.dialog-open { overflow:hidden; }
    .reading {
      width:100%; max-width:760px; margin:0 auto;
      padding:13px 15px calc(78px + env(safe-area-inset-bottom));
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-size: clamp(19px, 4.55vw, 22px);
      line-height:1.62;
      font-weight:400;
      letter-spacing:-.014em;
      overflow-wrap:break-word;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    .verse { display:inline; }
    /* Verses always flow continuously, including after navigation. */
    .bottom-bar {
      position:fixed; inset:auto 0 0; z-index:5;
      min-height:calc(44px + env(safe-area-inset-bottom));
      background:#393939; color:#dedede;
      border-top:1px solid #4a4a4a;
    }
    .position-button {
      display:flex; align-items:center; justify-content:space-between;
      gap:14px; height:44px; width:100%; max-width:760px;
      margin:0 auto; padding:0 16px;
      border:0; border-radius:0; background:transparent; color:inherit;
      text-align:left; font:500 12.5px/1.25 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing:.025em; cursor:pointer;
    }
    .position-button:focus-visible, .close:focus-visible, .back:focus-visible,
    .pick:focus-visible, .number:focus-visible { outline:2px solid #666; outline-offset:-3px; }
    .bottom-bar::after { content:""; display:block; height:env(safe-area-inset-bottom); }
    .caret { width:14px; height:14px; opacity:.55; flex:none; }
    .scrim {
      position:fixed; inset:0; z-index:20;
      display:flex; align-items:flex-end; justify-content:center;
      background:rgba(0,0,0,.35);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    .scrim[hidden] { display:none; }
    .sheet {
      background:#fff; width:100%; max-width:560px;
      height:min(82dvh,760px); min-height:min(440px,82dvh);
      border-radius:16px 16px 0 0;
      display:flex; flex-direction:column; overflow:hidden;
      box-shadow:0 -10px 35px rgba(0,0,0,.08);
    }
    .sheet-header {
      flex:none; display:grid; grid-template-columns:45px 1fr 45px;
      align-items:center; height:55px; padding:6px 11px;
      border-bottom:1px solid #ebebeb;
    }
    .step-title {
      font-size:15px; font-weight:600; color:#242424;
      text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .back,.close {
      border:0; background:transparent; color:#535353;
      display:grid; place-items:center; width:40px; height:40px;
      border-radius:8px; cursor:pointer;
    }
    .back[hidden] { visibility:hidden; display:grid; }
    .header-icon { width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .context { font-size:12px; color:#797979; padding:11px 22px 9px; flex:none; }
    .context[hidden] { display:none; }
    .search-wrap { padding:8px 18px 12px; border-bottom:1px solid #efefef; flex:none; }
    .search-wrap[hidden] { display:none; }
    .search {
      background:#f4f4f4; border:1px solid transparent; border-radius:9px;
      display:block; width:100%; height:43px; padding:0 13px; outline:none;
      color:#222; font:14px/1.3 inherit;
    }
    .search:focus { border-color:#acacac; background:#fff; }
    .choices { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding-bottom:calc(20px + env(safe-area-inset-bottom)); }
    .group-label { padding:20px 22px 7px; text-transform:uppercase; font-size:10px; font-weight:700; color:#999; letter-spacing:.13em; }
    .pick {
      display:flex; align-items:center; justify-content:space-between;
      border:0; border-bottom:1px solid #f0f0f0; background:#fff; width:100%;
      text-align:left; min-height:47px; padding:9px 22px;
      color:#262626; font:15px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      cursor:pointer;
    }
    .pick:active,.number:active { background:#f3f3f3; }
    .pick .arrow { color:#aaa; font-size:20px; font-weight:300; }
    .numbers { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; padding:11px 18px 10px; }
    .number {
      height:50px; border:1px solid #e8e8e8; border-radius:9px;
      background:#fff; color:#252525;
      font:500 15px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      cursor:pointer;
    }
    .no-results { padding:24px 22px; color:#888; font-size:14px; }
    @media (min-width:700px) {
      .reading { padding:22px 24px 90px; font-size:21px; }
      .scrim { align-items:center; padding:26px; }
      .sheet { border-radius:14px; height:min(76vh,670px); }
    }
    @media (max-width:360px) { .numbers { gap:7px; padding-inline:12px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; } }
    .reading {
      font-size:var(--reader-font-size,20px);
      text-align:var(--reader-align,left);
      -webkit-hyphens:var(--reader-hyphens,none);
      hyphens:var(--reader-hyphens,none);
    }
    /* Short text-layout sections keep typography changes fast on smartphones.
       No headings, blank paragraphs or gaps are added between sections. */
    .reading-segment {display:inline;margin:0;padding:0;}
    html,body,.reading {overflow-anchor:none;}
    .sheet-header { grid-template-columns:45px minmax(0,1fr) 43px 43px; }
    .settings-toggle {
      border:0; background:transparent; color:#686868; display:grid;
      place-items:center; width:40px; height:40px; border-radius:8px; cursor:pointer;
    }
    .settings-toggle[hidden] { display:none; }
    .settings-toggle:focus-visible, .setting-range:focus-visible,
    .setting-check:focus-visible {outline:2px solid #666;outline-offset:1px;}
    .settings-pane {padding:14px 22px 30px;}
    .setting-block {padding:14px 0 22px; border-bottom:1px solid #eee;}
    .setting-line { display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .setting-name {font-size:15px; font-weight:500; color:#282828;}
    .setting-value {font-size:13px; color:#666; font-variant-numeric:tabular-nums;}
    .setting-range {display:block;width:100%;height:30px; margin:14px 0 0; accent-color:#444;cursor:pointer;}
    .setting-row {display:flex;justify-content:space-between;align-items:center;gap:16px;padding:21px 0;border-bottom:1px solid #eee;cursor:pointer;}
    .setting-description {font-size:12px;line-height:1.5;color:#777;margin-top:5px;}
    .setting-check {width:19px;height:19px;flex:none;accent-color:#444;cursor:pointer;}
    .setting-status {font-size:12px;line-height:1.5;color:#777;padding-top:17px;min-height:35px;}

    /* Dark mode follows the in-app setting, never the system preference. */
    :root[data-theme="dark"] { color-scheme:dark; }
    html[data-theme="dark"], html[data-theme="dark"] body {background:#171717;color:#e6e6e2;}
    html[data-theme="dark"] .bottom-bar {background:#2b2b2b;color:#c7c7c7;border-color:#434343;}
    html[data-theme="dark"] .sheet {background:#232323;box-shadow:0 -10px 35px rgba(0,0,0,.35);}
    html[data-theme="dark"] .sheet-header {border-color:#393939;}
    html[data-theme="dark"] .step-title, html[data-theme="dark"] .setting-name {color:#ececec;}
    html[data-theme="dark"] .back, html[data-theme="dark"] .close,
    html[data-theme="dark"] .settings-toggle {color:#c5c5c5;}
    html[data-theme="dark"] .context, html[data-theme="dark"] .setting-description,
    html[data-theme="dark"] .setting-status {color:#a0a0a0;}
    html[data-theme="dark"] .group-label {color:#aaa;}
    html[data-theme="dark"] .no-results {color:#aaa;}
    html[data-theme="dark"] .search-wrap {border-color:#393939;}
    html[data-theme="dark"] .search {background:#303030;color:#eee;border-color:#444;}
    html[data-theme="dark"] .search:focus {background:#383838;border-color:#777;}
    html[data-theme="dark"] .search::placeholder {color:#aaa;}
    html[data-theme="dark"] .pick {background:#232323;color:#ebebeb;border-color:#393939;}
    html[data-theme="dark"] .pick:active,
    html[data-theme="dark"] .number:active {background:#393939;}
    html[data-theme="dark"] .pick .arrow {color:#888;}
    html[data-theme="dark"] .number {background:#2a2a2a;color:#eee;border-color:#484848;}
    html[data-theme="dark"] .setting-block, html[data-theme="dark"] .setting-row {border-color:#393939;}
    html[data-theme="dark"] .setting-value {color:#bdbdbd;}
    html[data-theme="dark"] .setting-range, html[data-theme="dark"] .setting-check {accent-color:#aaa;}
    html[data-theme="dark"] :is(.position-button,.back,.close,.settings-toggle,.pick,.number,.setting-check,.setting-range):focus-visible {outline-color:#aaa;}
    .data-status {font:14px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; letter-spacing:normal;}
    .data-status[hidden] {display:none;}
    .data-status button {font:inherit; padding:10px 14px; border:1px solid #aaa; border-radius:7px; background:transparent; color:inherit; cursor:pointer;}
    .data-status input[type=file] {display:block; margin-top:12px; max-width:100%; font:inherit;}
    .data-status p {margin:0 0 12px;}
    .data-status code {font-size:.92em; overflow-wrap:anywhere;}
    .position-button:disabled {cursor:default;opacity:.7;}
  </style>
</head>
<body>
  <main id="reading" class="reading" aria-label="Bibeltext" aria-busy="true">
    <div id="dataStatus" class="data-status" role="status" aria-live="polite">Bibeltext wird geladen …</div>
    <div id="text"></div>
  </main>
  <footer class="bottom-bar" aria-label="Leseposition und Navigation">
    <button class="position-button" id="positionButton" type="button" disabled aria-haspopup="dialog" aria-controls="jumpDialog">
      <span id="currentPosition">Lade Bibeltext …</span>
      <svg class="caret" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m7 14 5-5 5 5"/></svg>
    </button>
  </footer>
  <div id="jumpDialog" class="scrim" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="stepTitle">
      <div class="sheet-header">
        <button class="back" id="back" type="button" aria-label="Zurück" hidden>
          <svg class="header-icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="step-title" id="stepTitle">Buch auswählen</div>
        <button class="settings-toggle" id="settingsToggle" type="button" aria-label="Einstellungen" title="Einstellungen">
          <svg class="header-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2h4l.45 2.2a8.4 8.4 0 0 1 1.9.79l1.88-1.25 2.83 2.83-1.25 1.88c.33.6.59 1.23.79 1.9L23 10v4l-2.2.45a8.4 8.4 0 0 1-.79 1.9l1.25 1.88-2.83 2.83-1.88-1.25a8.4 8.4 0 0 1-1.9.79L14 23h-4l-.45-2.2a8.4 8.4 0 0 1-1.9-.79l-1.88 1.25-2.83-2.83 1.25-1.88a8.4 8.4 0 0 1-.79-1.9L1 14v-4l2.2-.45a8.4 8.4 0 0 1 .79-1.9L2.74 5.77l2.83-2.83L7.45 4.2a8.4 8.4 0 0 1 1.9-.79L10 2Z"/><circle cx="12" cy="12" r="3.5"/></svg>
        </button>
        <button class="close" id="close" type="button" aria-label="Schliessen">
          <svg class="header-icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="context" class="context" hidden></div>
      <div id="searchWrap" class="search-wrap">
        <input id="search" class="search" type="search" placeholder="Buch suchen" autocomplete="off" spellcheck="false" aria-label="Bibelbuch suchen">
      </div>
      <div id="choices" class="choices"></div>
    </section>
  </div>

    const byId=new Map();

      ids.push(loadedRefs.length);
      loadedRefs.push([b,c,v]);
      loadedTexts.push(row.text.trim());

    dataStatus.replaceChildren();
    const description=document.createElement('p');
    description.textContent='Die Bibeldaten konnten nicht aus ./data/slt2000.json geladen werden.';
    const help=document.createElement('p');
    help.textContent=location.protocol==='file:'
      ? 'Beim direkten Öffnen einer HTML-Datei blockieren viele Browser den Zugriff auf andere lokale Dateien. Verwende einen lokalen Webserver oder wähle die JSON-Datei manuell aus.'
      : 'Prüfe, ob die JSON-Datei im Unterordner data liegt und der Webserver sie ausliefert.';
    const input=document.createElement('input');
    input.type='file';input.accept='.json,application/json';
    input.setAttribute('aria-label','slt2000.json auswählen');
    input.addEventListener('change', async () => {
      if (!input.files?.[0]) return;
      try {
        dataStatus.textContent='Bibeltext wird gelesen …';
        await startReader(JSON.parse(await input.files[0].text()));
      } catch (problem) {showDataError(problem);}
    });
    const detail=document.createElement('p');
    detail.style.fontSize='12px';
    detail.style.opacity='.7';
    detail.textContent=String(error?.message||error);
    dataStatus.append(description,help,input,detail);
  }
  async function startReader(data) {
    // Validate everything before replacing the reading view.
    loadBibleData(data);
    dataStatus.hidden=true;
    reading.setAttribute('aria-busy','false');
    positionButton.disabled=false;
    scrollToVerse(storedIndex());
    if (settings.hyphenation) updateSoftHyphens();
  }
  async function loadFromFolder() {
    try {
      const response=await fetch('./data/slt2000.json');
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      await startReader(await response.json());
    } catch (error) { showDataError(error); }
  }
  loadFromFolder();
  </script>
</body>
</html>
